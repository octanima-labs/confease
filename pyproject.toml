[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confease"
version = "2.0.0"
description = "Small Python configuration helper with predictable source precedence"
readme = "README.md"
license = "MIT"
authors = [
  { name = "octanima-labs", email = "34071457+octanima-labs@users.noreply.github.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "2ning",
  "PyYAML",
  "ruamel.yaml>=0.19.1",
  "tomlkit>=0.15.1",
  "iniparse>=0.5",
]

[project.scripts]
confease = "confease.cli:main"

[project.urls]
Repository = "https://github.com/octanima-labs/confease"
Documentation = "https://octanima-labs.github.io/confease"
Issues = "https://github.com/octanima-labs/confease/issues"

[dependency-groups]
dev = [
  "build",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
  "types-PyYAML",
]
docs = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["tuning", "iniparse", "iniparse.*"]
ignore_missing_imports = true

[tool.hatch.envs.default]
dependencies = [
  "build",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
  "types-PyYAML",
]

[tool.hatch.envs.docs]
dependencies = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W -b html docs docs/_build/html"

[tool.hatch.build.targets.wheel]
packages = ["src/confease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
